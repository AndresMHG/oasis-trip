<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oasis Trip Turismo y Viajes">
  <!-- Emblem: globe + flight path -->
  <circle cx="40" cy="40" r="30" fill="#0F3D57"/>
  <circle cx="40" cy="40" r="30" fill="url(#g)" opacity="0.25"/>
  <path d="M40 12 a28 28 0 0 1 0 56 a28 28 0 0 1 0 -56" fill="none"/>
  <!-- latitude/longitude lines -->
  <ellipse cx="40" cy="40" rx="12" ry="28" fill="none" stroke="#9EC5D6" stroke-width="1.4" opacity="0.6"/>
  <line x1="12" y1="40" x2="68" y2="40" stroke="#9EC5D6" stroke-width="1.4" opacity="0.6"/>
  <line x1="16" y1="26" x2="64" y2="26" stroke="#9EC5D6" stroke-width="1.1" opacity="0.45"/>
  <line x1="16" y1="54" x2="64" y2="54" stroke="#9EC5D6" stroke-width="1.1" opacity="0.45"/>
  <!-- flight arc -->
  <path d="M20 54 Q40 18 62 30" fill="none" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 4"/>
  <!-- plane -->
  <g transform="translate(58 26) rotate(28)">
    <path d="M0 0 L14 4 L4 6 L1 12 L-1 6 L-6 8 L-3 4 Z" fill="#F4A261"/>
  </g>
  <circle cx="20" cy="54" r="2.6" fill="#F4A261"/>
  <!-- Wordmark -->
  <text x="84" y="40" font-family="'Poppins','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#0F3D57">Oasis<tspan fill="#F4A261"> Trip</tspan></text>
  <text x="85" y="58" font-family="'Poppins','Segoe UI',sans-serif" font-size="10.5" letter-spacing="3.2" fill="#4A4A4A">TURISMO Y VIAJES</text>
  <defs>
    <linearGradient id="g" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E8BB0"/>
      <stop offset="1" stop-color="#0F3D57"/>
    </linearGradient>
  </defs>
</svg>
